apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      containers:
        - name: payment-service
          image: payment-service:local
          imagePullPolicy: Never
          ports: [{ containerPort: 5004 }]
          envFrom:
            - configMapRef: { name: payment-service-config }
            - secretRef: { name: payment-service-secret }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 5004 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5004 }
            initialDelaySeconds: 15
            periodSeconds: 20