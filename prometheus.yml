global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:5000"]

  - job_name: "movie-catalog"
    static_configs:
      - targets: ["movie-catalog:5001"]

  - job_name: "seat-service"
    static_configs:
      - targets: ["seat-service:5002"]

  - job_name: "booking-service"
    static_configs:
      - targets: ["booking-service:5003"]

  - job_name: "payment-service"
    static_configs:
      - targets: ["payment-service:5004"]

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:5005"]

  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
